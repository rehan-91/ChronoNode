<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Attendance Platform</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            color: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 28rem;
            width: 100%;
            text-align: center;
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        p { color: #4b5563; }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            background-color: #dbeafe;
            color: #1e40af;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Development Mode</span>
        <h1>HRMS Attendance Platform</h1>
        <p>The PHP backend application is structured and ready.</p>
        <p>To run this application, export the repository and follow the documentation in <strong>/docs/developer-guide.md</strong> to start the PHP and MySQL services locally.</p>
    </div>
</body>
</html>
